name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # better-sqlite3 הוא מודול מקומפל; npmRebuild:true בונה אותו מול ה-ABI של Electron.
      # continue-on-error כדי שצילום המצב והעלאת הארטיפקטים ירוצו גם כשהאריזה נשברת.
      - name: Build (portable + installer)
        id: build
        continue-on-error: true
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DEBUG: electron-builder,app-builder

      - name: Snapshot state
        if: always()
        shell: pwsh
        run: |
          Write-Output "=== node/npm ==="
          node -v; npm -v
          Write-Output "=== disk ==="
          Get-PSDrive C | Select-Object Used,Free
          Write-Output "=== dist ==="
          if (Test-Path dist) {
            Get-ChildItem dist -Recurse -File | Select-Object FullName,Length | Format-Table -AutoSize | Out-String -Width 400
            if (Test-Path dist/win-unpacked/resources/app/node_modules/better-sqlite3/build/Release/better_sqlite3.node) {
              Write-Output "better_sqlite3: present"
            } else { Write-Output "better_sqlite3: MISSING" }
          } else { Write-Output "no dist dir" }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuchut-windows-x64
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.yaml
            dist/*.blockmap
          if-no-files-found: warn

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: |
          Write-Output "::error::הבנייה נכשלה — ראו את הארטיפקט nuchut-windows-x64 (builder-debug.yml) ואת פלט שלב ה-Build."
          exit 1
        shell: pwsh

      - name: Create release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
