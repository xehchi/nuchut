name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # better-sqlite3 הוא מודול מקומפל; npmRebuild:true בונה אותו מול ה-ABI של Electron
      - name: Build (portable + installer)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DEBUG: electron-builder,app-builder

      # מצב האבחון היחיד: פריסת הקבצים שהצלחנו לארוז, כדי לראות איפה האריזה נשברת
      - name: Diagnose on failure
        if: failure()
        shell: pwsh
        run: |
          Write-Output "=== node/npm ==="
          node -v; npm -v
          Write-Output "=== disk ==="
          Get-PSDrive C | Select-Object Used,Free
          Write-Output "=== dist ==="
          if (Test-Path dist) {
            Get-ChildItem dist -Recurse -File | Measure-Object -Sum Length | Select-Object Count,Sum
            Get-ChildItem dist -Filter *.yml | ForEach-Object { Write-Output "--- $($_.Name) ---"; Get-Content $_.FullName -TotalCount 40 }
            if (Test-Path dist/win-unpacked) {
              Get-ChildItem dist/win-unpacked -Recurse -File | Measure-Object -Sum Length | Select-Object Count,Sum
              Get-ChildItem dist/win-unpacked/resources/app/node_modules -ErrorAction SilentlyContinue | Select-Object -First 40 Name
              Test-Path dist/win-unpacked/resources/app/node_modules/better-sqlite3/build/Release/better_sqlite3.node
            }
          } else { Write-Output "no dist dir" }
          Write-Output "=== temp ==="
          Get-PSDrive C | Select-Object Free

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuchut-windows-x64
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: warn

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
